name: Build SolarBalls APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip3 install --user --upgrade Cython==0.29.36 "buildozer>=1.5.0"

      - name: Prepare Game Files
        run: |
          mkdir -p temp_unpacked
          find . -maxdepth 1 -name "*.zip" -exec unzip -o -q "{}" -d temp_unpacked \;
          GAME_DIR=$(find temp_unpacked -name "*.py" -exec dirname {} \; | head -n 1)
          cp -r "$GAME_DIR"/* .
          [ -f solarballs.py ] && [ ! -f main.py ] && cp solarballs.py main.py || true
          
          cat << 'EOF' > buildozer.spec
          [app]
          title = Solar Balls
          package.name = solarballs
          package.domain = org.solarballs
          source.dir = .
          source.include_exts = py,png,jpg,wav,ogg,json
          version = 1.0.0
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          export PATH=$JAVA_HOME/bin:$PATH:$HOME/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarBalls-APK
          path: bin/*.apk
