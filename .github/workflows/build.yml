name: Build SolarBalls APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildozer Environment
        uses: kivy/buildozer-action@v1

      - name: Unpack game and configure
        run: |
          mkdir -p temp_unpacked
          find . -maxdepth 1 -name "*.zip" -exec unzip -o -q "{}" -d temp_unpacked \;
          GAME_DIR=$(find temp_unpacked -name "*.py" -exec dirname {} \; | head -n 1)
          cp -r "$GAME_DIR"/* .
          [ -f solarballs.py ] && [ ! -f main.py ] && cp solarballs.py main.py || true
          cat << 'EOF' > buildozer.spec
          [app]
          title = SolarBalls
          package.name = solarballs
          package.domain = org.solarballs
          source.dir = .
          source.include_exts = py,png,jpg,wav,ogg,json
          version = 1.0.0
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True
          android.api = 33
          android.minapi = 21
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarBalls-Game-APK
          path: bin/*.apk
