name: Build SolarBalls APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip3 install --user --upgrade "Cython<3.0" "buildozer>=1.5.0"

      - name: Prepare Game Files and Spec
        run: |
          # Чистим временную папку и распаковываем свежий архив
          rm -rf temp_unpacked
          mkdir -p temp_unpacked
          unzip -o -q "solarballs (2) (1).zip" -d temp_unpacked
          
          # Находим директорию с игрой и переносим файлы в корень
          PY_FILE=$(find temp_unpacked -type f \( -name "main.py" -o -name "solarballs.py" \) | head -n 1)
          if [ -n "$PY_FILE" ]; then
            GAME_DIR="$(dirname "$PY_FILE")"
            cp -r "$GAME_DIR"/* .
          fi
          
          # Гарантируем правильное имя точки входа
          [ -f solarballs.py ] && [ ! -f main.py ] && mv solarballs.py main.py || true

          # Генерируем конфигурацию с жестким альбомным режимом и поддержкой всех ассетов
          cat << 'EOF' > buildozer.spec
          [app]
          title = Solar Balls
          package.name = solarballs
          package.domain = org.solarballs
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,wav,ogg,mp3,json
          source.include_patterns = sounds/*
          version = 1.0.0
          requirements = python3==3.10.12,hostpython3==3.10.12,pygame
          orientation = landscape
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH:$HOME/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarBalls-APK
          path: bin/*.apk
