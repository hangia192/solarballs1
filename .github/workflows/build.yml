name: Build SolarBalls APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade Cython==0.29.36 buildozer

      - name: Unpack game and configure
        run: |
          mkdir -p temp_unpacked
          find . -maxdepth 1 -name "*.zip" -exec unzip -o -q "{}" -d temp_unpacked \;
          GAME_DIR=$(find temp_unpacked -name "*.py" -exec dirname {} \; | head -n 1)
          cp -r "$GAME_DIR"/* .
          [ -f solarballs.py ] && [ ! -f main.py ] && cp solarballs.py main.py || true
          cat << 'EOF' > buildozer.spec
          [app]
          title = SolarBalls
          package.name = solarballs
          package.domain = org.solarballs
          source.dir = .
          source.include_exts = py,png,jpg,wav,ogg,json
          version = 1.0.0
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk_path = /usr/local/lib/android/sdk
          android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          ~/.local/bin/buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarBalls-Game-APK
          path: bin/*.apk
